<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Memória+ - Jogo da memória educativo para crianças e adultos."
    >

    <title>Memória+ | Jogo da Memória</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="container">

        <!-- ==========================
             MENU PRINCIPAL
        =========================== -->

        <section id="menu">

            <header class="header">

                <h1>🧠 Memória+</h1>

                <p>
                    Aprenda brincando!
                </p>

            </header>


            <div class="menu-card">

                <h2>
                    Escolha uma categoria
                </h2>


                <div class="categories">

                    <button
                        class="category animal"
                        data-category="animals"
                    >
                        🐶
                        <span>Animais</span>
                    </button>


                    <button
                        class="category math"
                        data-category="math"
                    >
                        ➕
                        <span>Matemática</span>
                    </button>


                    <button
                        class="category geography"
                        data-category="geography"
                    >
                        🌎
                        <span>Geografia</span>
                    </button>


                    <button
                        class="category science"
                        data-category="science"
                    >
                        🔬
                        <span>Ciências</span>
                    </button>

                </div>


                <h2>
                    Escolha a dificuldade
                </h2>


                <div class="difficulty">

                    <button
                        class="difficulty-button easy"
                        data-difficulty="easy"
                    >
                        🟢 Fácil
                    </button>


                    <button
                        class="difficulty-button medium"
                        data-difficulty="medium"
                    >
                        🟡 Médio
                    </button>


                    <button
                        class="difficulty-button hard"
                        data-difficulty="hard"
                    >
                        🔴 Difícil
                    </button>

                </div>


                <p
                    id="message"
                    class="message"
                >
                    Escolha uma categoria e uma dificuldade.
                </p>


                <button
                    id="start-button"
                    class="start-button"
                >
                    🚀 Começar jogo
                </button>

            </div>

        </section>


        <!-- ==========================
             JOGO
        =========================== -->

        <section
            id="game"
            class="hidden"
        >

            <div class="game-header">

                <div>

                    <h1>
                        🧠 Memória+
                    </h1>

                    <p id="category-name">
                        Jogo da memória
                    </p>

                </div>


                <button
                    id="back-button"
                    class="back-button"
                >
                    ← Menu
                </button>

            </div>


            <!-- PLACAR -->

            <div class="score-board">

                <div class="score-box">

                    <span>🎯</span>

                    <strong>
                        Pontos
                    </strong>

                    <span id="score">
                        0
                    </span>

                </div>


                <div class="score-box">

                    <span>🔢</span>

                    <strong>
                        Tentativas
                    </strong>

                    <span id="attempts">
                        0
                    </span>

                </div>


                <div class="score-box">

                    <span>⏱️</span>

                    <strong>
                        Tempo
                    </strong>

                    <span id="timer">
                        00:00
                    </span>

                </div>

            </div>


            <!-- TABULEIRO -->

            <div
                id="game-board"
                class="game-board"
            >

            </div>

        </section>


        <!-- ==========================
             VITÓRIA
        =========================== -->

        <section
            id="victory"
            class="hidden"
        >

            <div class="victory-card">

                <div class="trophy">
                    🏆
                </div>


                <h1>
                    Parabéns!
                </h1>


                <p>
                    Você encontrou todos os pares!
                </p>


                <div class="results">

                    <div>
                        🎯
                        <strong>
                            Pontos
                        </strong>

                        <span id="final-score">
                            0
                        </span>
                    </div>


                    <div>
                        🔢
                        <strong>
                            Tentativas
                        </strong>

                        <span id="final-attempts">
                            0
                        </span>
                    </div>


                    <div>
                        ⏱️
                        <strong>
                            Tempo
                        </strong>

                        <span id="final-time">
                            00:00
                        </span>
                    </div>

                </div>


                <button
                    id="play-again"
                    class="start-button"
                >
                    🔄 Jogar novamente
                </button>


                <button
                    id="victory-menu"
                    class="back-button"
                >
                    🏠 Voltar ao menu
                </button>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
