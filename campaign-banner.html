<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memória+ Academy | Banner de campanha</title>
    <style>
        :root {
            --bg-1: #120a2d;
            --bg-2: #1b1146;
            --bg-3: #132c66;
            --purple: #7c3aed;
            --blue: #0ea5e9;
            --green: #22c55e;
            --yellow: #facc15;
            --white: #f8fafc;
            --text: #e2e8f0;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--white);
            background:
                radial-gradient(circle at 15% 20%, rgba(251, 146, 60, 0.18), transparent 18%),
                radial-gradient(circle at 85% 18%, rgba(34, 197, 94, 0.18), transparent 18%),
                radial-gradient(circle at 50% 100%, rgba(14, 165, 233, 0.18), transparent 26%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2) 32%, var(--bg-3) 100%);
            padding: 24px;
        }

        .banner {
            position: relative;
            width: min(100%, 1200px);
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(23, 31, 74, 0.9));
            border: 1px solid rgba(196, 181, 253, 0.45);
            border-radius: 36px;
            overflow: hidden;
            box-shadow: 0 28px 70px rgba(15, 23, 42, 0.44), 0 0 40px rgba(124, 58, 237, 0.18);
        }

        .banner::before,
        .banner::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(12px);
            opacity: 0.8;
        }

        .banner::before {
            width: 320px;
            height: 320px;
            right: -70px;
            top: -90px;
            background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,255,255,0) 28%), linear-gradient(135deg, rgba(14,165,233,0.6), rgba(124,58,237,0.5), rgba(34,197,94,0.25));
        }

        .banner::after {
            width: 280px;
            height: 280px;
            left: -60px;
            bottom: -100px;
            background: radial-gradient(circle, rgba(255,255,255,0.86), rgba(255,255,255,0) 28%), linear-gradient(135deg, rgba(250,204,21,0.5), rgba(251,146,60,0.4), rgba(168,85,247,0.22));
        }

        .content {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 30px;
            align-items: center;
            padding: 42px clamp(22px, 3vw, 48px);
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.14);
            color: var(--white);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        h1 {
            margin: 18px 0 12px;
            font-size: clamp(38px, 5vw, 82px);
            line-height: 0.9;
            letter-spacing: -3px;
        }

        h1 span {
            color: var(--yellow);
        }

        p {
            margin: 0;
            max-width: 620px;
            color: var(--text);
            font-size: clamp(16px, 2vw, 22px);
            line-height: 1.5;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
        }

        .badges span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 28px;
            padding: 18px 32px;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--purple) 0%, var(--blue) 38%, var(--green) 100%);
            color: var(--white);
            font-weight: 900;
            font-size: 20px;
            box-shadow: 0 14px 30px rgba(79,70,229,0.30);
        }

        .visual {
            position: relative;
            height: 330px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .visual-ring {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.35), rgba(250,204,21,0.12), rgba(255,255,255,0));
            filter: blur(8px);
        }

        .card {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 120px;
            height: 120px;
            border-radius: 28px;
            font-size: 56px;
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 20px 32px rgba(15, 23, 42, 0.22);
            animation: floatCard 6s ease-in-out infinite;
        }

        .card.a { left: 18%; top: 18%; background: linear-gradient(135deg, #86efac, #22c55e); }
        .card.b { right: 16%; top: 28%; background: linear-gradient(135deg, #c4b5fd, #7c3aed); animation-delay: 1s; }
        .card.c { left: 48%; bottom: 10%; transform: translateX(-50%); background: linear-gradient(135deg, #7dd3fc, #0ea5e9); animation-delay: 2s; }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(6deg); }
        }

        @media (max-width: 820px) {
            .content {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .badges, .cta {
                justify-content: center;
            }

            .visual {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="banner" role="img" aria-label="Banner publicitário do Memória+ Academy com tema premium, educativo e gamer">
        <div class="content">
            <div>
                <span class="eyebrow">LANÇAMENTO OFICIAL</span>
                <h1>Memória<span>+</span> Academy</h1>
                <p>Jogo premium de memória para aprender, competir e evoluir. Pronto para web e celular, com uma experiência moderna, educativa e gamer.</p>
                <div class="badges">
                    <span>📱 Web</span>
                    <span>🧠 Educação</span>
                    <span>🎮 Gamer</span>
                    <span>🏆 Ranking</span>
                </div>
                <button class="cta" type="button">Começar a jogar</button>
            </div>
            <div class="visual" aria-hidden="true">
                <div class="visual-ring"></div>
                <div class="card a">🐶</div>
                <div class="card b">➕</div>
                <div class="card c">🌎</div>
            </div>
        </div>
    </div>
</body>
</html>
